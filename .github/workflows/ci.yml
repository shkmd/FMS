name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fms
          POSTGRES_PASSWORD: fms_dev_password
          POSTGRES_DB: fms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fms -d fms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fms:fms_dev_password@localhost:5432/fms_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Prisma generate & migrate
        run: |
          pnpm --filter @fms/api exec prisma generate
          pnpm --filter @fms/api exec prisma migrate deploy

      - name: Unit tests
        run: pnpm --filter @fms/api test

      - name: E2E tests
        run: pnpm --filter @fms/api test:e2e

      - name: Build
        run: pnpm -w build
